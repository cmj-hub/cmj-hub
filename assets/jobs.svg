  <text x="1216" y="104" fill="#EAEAF0" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="18" font-weight="600" text-anchor="end">Jay Mount</text>
  <g fill="#EAEAF0" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="64" font-weight="600" letter-spacing="-1.28">
    <text class="c c0" x="64" y="216">Value proposition</text>
    <text class="c c1" x="64" y="216">Landing page</text>
    <text class="c c2" x="64" y="216">Pricing strategy</text>
    <text class="c c3" x="64" y="216">Generative engine optimization</text>
    <text class="c c4" x="64" y="216">Cold email</text>
    <text class="c c5" x="64" y="216">LinkedIn posts</text>
