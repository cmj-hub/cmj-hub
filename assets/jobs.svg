<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="Claude Code skills for a value proposition, landing page, pricing strategy, generative engine optimization, answer engine optimization, cold email, LinkedIn posts, ideal customer profile, sales prospecting, sales offer, and email sequence. Jay Mount.">
  <style>
    .c { animation-duration: 20s; animation-timing-function: linear; animation-iteration-count: infinite; animation-fill-mode: both; }
    .c0 { animation-name: p0; }
    .c1 { animation-name: p1; }
    .c2 { animation-name: p2; }
    .c3 { animation-name: p3; }
    .c4 { animation-name: p4; }
    .c5 { animation-name: p5; }
    .c6 { animation-name: p6; }
    .c7 { animation-name: p7; }
    .c8 { animation-name: p8; }
    .c9 { animation-name: p9; }
    @keyframes p0 { 0%, 9.9999% { opacity: 1; } 10%, 100% { opacity: 0; } }
    @keyframes p1 { 0%, 9.9999% { opacity: 0; } 10%, 19.9999% { opacity: 1; } 20%, 100% { opacity: 0; } }
    @keyframes p2 { 0%, 19.9999% { opacity: 0; } 20%, 29.9999% { opacity: 1; } 30%, 100% { opacity: 0; } }
    @keyframes p3 { 0%, 29.9999% { opacity: 0; } 30%, 39.9999% { opacity: 1; } 40%, 100% { opacity: 0; } }
    @keyframes p4 { 0%, 39.9999% { opacity: 0; } 40%, 49.9999% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @keyframes p5 { 0%, 49.9999% { opacity: 0; } 50%, 59.9999% { opacity: 1; } 60%, 100% { opacity: 0; } }
    @keyframes p6 { 0%, 59.9999% { opacity: 0; } 60%, 69.9999% { opacity: 1; } 70%, 100% { opacity: 0; } }
    @keyframes p7 { 0%, 69.9999% { opacity: 0; } 70%, 79.9999% { opacity: 1; } 80%, 100% { opacity: 0; } }
    @keyframes p8 { 0%, 79.9999% { opacity: 0; } 80%, 89.9999% { opacity: 1; } 90%, 100% { opacity: 0; } }
    @keyframes p9 { 0%, 89.9999% { opacity: 0; } 90%, 99.9999% { opacity: 1; } 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .c { animation: none; opacity: 0; }
      .c0 { opacity: 1; }
    }
  </style>
  <rect width="1280" height="320" fill="#060609"/>
  <rect x="64" y="128" width="48" height="4" fill="#00D4FF"/>
