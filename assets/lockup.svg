<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="Jay Mount. Claude Code skills for a value proposition, a landing page, pricing strategy, and generative engine optimization. Also cold email, LinkedIn posts, answer engine optimization, an ideal customer profile, sales prospecting, a sales offer, and an email sequence.">
  <style>
