    @keyframes p5 { 0%, 71.4284% { opacity: 0; } 71.4285%, 85.7141% { opacity: 1; } 85.7142%, 100% { opacity: 0; } }
    @keyframes p6 { 0%, 85.7141% { opacity: 0; } 85.7142%, 99.9999% { opacity: 1; } 100% { opacity: 0; } }
